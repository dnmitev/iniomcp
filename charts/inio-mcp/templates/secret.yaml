{{- if and .Values.secret.create (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "inio-mcp.fullname" . }}
  labels:
    {{- include "inio-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  INIO_CLIENT_SECRET: {{ required "secret.clientSecret is required" .Values.secret.clientSecret | quote }}
  MCP_AUTH_TOKEN: {{ required "secret.authToken is required" .Values.secret.authToken | quote }}
{{- end }}
