# inio-mcp runs here as a shared Streamable HTTP server (MCP_TRANSPORT=http) on port 3000.

replicaCount: 2

# Evicts at most one pod at a time during node drains and upgrades, waiting for its replacement to be Ready before the
# next. Pods that are not Ready can always be evicted (unhealthyPodEvictionPolicy: AlwaysAllow, Kubernetes 1.27+).
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# CPU-based HorizontalPodAutoscaler (needs metrics-server and resources.requests.cpu). When enabled, the HPA owns the
# replica count and replicaCount is ignored. Turning it on for a running release can drop to one pod for a few seconds
# until the HPA scales back to minReplicas.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

image:
  repository: ghcr.io/dnmitev/inio-mcp
  # Defaults to the chart's appVersion.
  tag: ''
  # sha256:... pins the image by digest and takes precedence over tag.
  digest: ''
  pullPolicy: IfNotPresent

inio:
  # Required: API base URL including /v1, token endpoint (or realm issuer URL), API client id.
  url: ''
  authUrl: ''
  clientId: ''
  # Optional; left out when empty, so the server defaults apply.
  allowWrites: false
  writeTools: [] # e.g. [create_customer_pause, cancel_customer_pause]
  maxPaymentAmount: '' # e.g. "500"
  revealPii: false
  logLevel: '' # fatal … trace, or silent
  requestTimeoutMs: '' # e.g. "30000"

# OAuth sign-in for Claude on the web, Desktop and mobile (see docs/hosting.md "Sign-in with OAuth").
# Off while issuer is empty. The static MCP_AUTH_TOKEN keeps working next to it.
oauth:
  issuer: '' # e.g. https://idp.example/realms/mcp
  publicUrl: '' # public URL of /mcp; default https://<ingress.host>/mcp, else https://<first HTTPRoute hostname>/mcp
  audience: '' # aud the provider puts in access tokens; default publicUrl

# Browser origins allowed besides localhost. Empty: https:// plus the ingress host and HTTPRoute hostnames.
allowedOrigins: []

# Secret with the keys INIO_CLIENT_SECRET and MCP_AUTH_TOKEN (created by hand or by External Secrets Operator).
existingSecret: ''

# For tests only: let the chart create the Secret from these values. Prefer existingSecret.
secret:
  create: false
  clientSecret: ''
  authToken: ''

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: nginx
  host: ''
  annotations: {}
  # ingress-nginx defaults that suit MCP:
  #   nginx.ingress.kubernetes.io/proxy-body-size: 256k
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
  #   nginx.ingress.kubernetes.io/proxy-buffering: "off"
  tls:
    secretName: ''

# Gateway API (gateway.networking.k8s.io/v1). Can run alongside the Ingress during a migration.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  #  - name: shared-gateway
  #    namespace: gateway-system
  #    sectionName: https
  hostnames: []
  timeouts: {}
  #  request: 120s

# Seconds to wait before SIGTERM so the proxy stops sending traffic first.
preStopSleepSeconds: 5
terminationGracePeriodSeconds: 30

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi

# Spread pods across nodes and zones when possible (ScheduleAnyway: never blocks scheduling).
topologySpread:
  enabled: true

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
