version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The runtime stays on the Node 24 LTS line; a major Node upgrade is a deliberate change.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types follow the runtime (Node 24, engines >=24).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
