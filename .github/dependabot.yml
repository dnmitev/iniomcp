version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The image runs Node 26 LTS; moving to a new Node major is a deliberate change.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # The node adapter's peer range follows the server's minor version, so the SDK packages move together.
      mcp-sdk:
        patterns: ['@modelcontextprotocol/*']
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types track the lowest supported Node (engines >=24).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
