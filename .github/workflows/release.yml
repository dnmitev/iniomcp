name: release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

# One group for all releases: they share npm "latest" and the image "latest" tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dnmitev/inio-mcp

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      newest: ${{ steps.version.outputs.newest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - id: version
        name: Check tag, version, branch and changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG is not on main"; exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *)
              prerelease=false
              if ! grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
                echo "::error::CHANGELOG.md has no dated '## [$version] - YYYY-MM-DD' section"; exit 1
              fi
              ;;
          esac
          # Only the highest final version may move the "latest" tags.
          highest=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -v -- - | head -n 1)
          newest=false
          if [ "$prerelease" = false ] && [ "$highest" = "$TAG" ]; then newest=true; fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "newest=$newest"
          } >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:package

  live:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm ci --ignore-scripts
      - run: npm run test:live
        env:
          INIO_LIVE: '1'
          INIO_CLIENT_ID: ${{ secrets.INIO_CLIENT_ID }}
          INIO_CLIENT_SECRET: ${{ secrets.INIO_CLIENT_SECRET }}
          INIO_AUTH_URL: ${{ vars.INIO_AUTH_URL }}
          INIO_URL: ${{ vars.INIO_URL }}

  npm:
    needs: [verify, live]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Check npm supports trusted publishing
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"
      - run: npm ci --ignore-scripts
      - name: Publish (skipped if this version exists)
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          NEWEST: ${{ needs.verify.outputs.newest }}
        run: |
          # Only a 404 means "not published yet"; any other error stops the job.
          if out=$(npm view "@dnmitev/inio-mcp@$VERSION" version 2>&1); then
            if [ -n "$out" ]; then
              echo "@dnmitev/inio-mcp@$VERSION is already published; skipping"; exit 0
            fi
          elif ! printf '%s' "$out" | grep -q E404; then
            echo "$out"; echo "::error::npm view failed"; exit 1
          fi
          if [ "$PRERELEASE" = true ]; then
            npm publish --tag next
          elif [ "$NEWEST" = true ]; then
            npm publish
          else
            # An older line (e.g. a backport) must not move "latest" backward.
            npm publish --tag legacy
          fi

  image:
    needs: [verify, live]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        name: Skip if this version's image exists
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # Only "not found" means the image is missing; any other error stops the job.
          if out=$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1); then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$IMAGE:$VERSION exists; skipping"
          elif printf '%s' "$out" | grep -qiE 'not found|manifest unknown'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "$out"; echo "::error::Image lookup failed"; exit 1
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.exists.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.exists.outputs.skip != 'true'
      - id: meta
        if: steps.exists.outputs.skip != 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.verify.outputs.newest == 'true' }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=inio-mcp
            org.opencontainers.image.description=MCP server for the Inio REST API (stdio and HTTP)
            org.opencontainers.image.licenses=Apache-2.0
      # Build and run the amd64 image before pushing anything, so a broken image is never published.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.exists.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: inio-mcp:smoke
      - name: Smoke-test the image over HTTP
        if: steps.exists.outputs.skip != 'true'
        run: |
          token=$(openssl rand -hex 20)
          trap 'docker logs smoke || true; docker rm -f smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name smoke -p 127.0.0.1:3000:3000 \
            -e MCP_TRANSPORT=http -e MCP_AUTH_TOKEN="$token" \
            -e INIO_URL=https://example.invalid/v1 -e INIO_AUTH_URL=https://example.invalid/token \
            -e INIO_CLIENT_ID=smoke -e INIO_CLIENT_SECRET=smoke \
            inio-mcp:smoke
          ready=false
          for _ in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:3000/ && { ready=true; break; }; sleep 1; done
          [ "$ready" = true ] || { echo "::error::Image did not start listening within 30 s"; exit 1; }
          unauth=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/mcp)
          init=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/mcp \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}')
          echo "unauthenticated: $unauth, initialize: $init"
          [ "$unauth" = 401 ] && [ "$init" = 200 ]
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.exists.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  release:
    needs: [verify, npm, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create GitHub Release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          NEWEST: ${{ needs.verify.outputs.newest }}
        run: |
          base="${VERSION%%-*}"
          awk -v v="$base" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Release $VERSION" > notes.md; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping"; exit 0
          fi
          flags=(--verify-tag)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          if [ "$NEWEST" != true ]; then flags+=(--latest=false); fi
          gh release create "$TAG" --title "$VERSION" --notes-file notes.md "${flags[@]}"
